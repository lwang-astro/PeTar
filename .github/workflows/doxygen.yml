name: Doxygen Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Install doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen graphviz pandoc
      - name: Build documentation
        working-directory: doc
        run: ( cat doxygen.conf; echo 'GENERATE_LATEX = NO' ) | doxygen -
      - name: Assemble site (README homepage + docs at original path)
        run: |
          mkdir -p _site/doc
          pandoc -s --metadata title="PeTar" -f gfm -t html README.md -o _site/index.html
          cp -r doc/html _site/doc/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
